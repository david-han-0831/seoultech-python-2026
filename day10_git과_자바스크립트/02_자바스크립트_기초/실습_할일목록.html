<!DOCTYPE html>
<!--
  실습 - 할 일 목록 (To-Do List)

  오늘 배운 것을 전부 씁니다.
    변수(const/let), 배열, 객체, 함수, 화살표 함수,
    map/filter, DOM 선택, 이벤트, 요소 생성, localStorage

  브라우저로 이 파일을 열면 바로 동작합니다.
  코드를 위에서부터 읽으며 직접 고쳐 보세요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "맑은 고딕", sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f7f8fa;
      color: #222;
    }
    h1 { text-align: center; }
    .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
    #todoInput {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #addBtn {
      padding: 12px 20px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
    }
    #addBtn:hover { background: #2563eb; }

    .filters { display: flex; gap: 6px; margin-bottom: 12px; }
    .filters button {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
    .filters button.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }

    ul { list-style: none; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    li.done span { text-decoration: line-through; color: #9ca3af; }
    li span { flex: 1; }
    li button {
      border: none;
      background: #ef4444;
      color: #fff;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
    }
    #status { text-align: center; color: #6b7280; font-size: 14px; }
    .empty { text-align: center; color: #9ca3af; padding: 30px 0; }
  </style>
</head>
<body>

  <h1>할 일 목록</h1>

  <div class="input-row">
    <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter">
    <button id="addBtn">추가</button>
  </div>

  <div class="filters">
    <button class="active" data-filter="all">전체</button>
    <button data-filter="active">진행 중</button>
    <button data-filter="done">완료</button>
  </div>

  <ul id="todoList"></ul>
  <p id="status"></p>


  <script>
    // ===========================================================
    // 1. 데이터 - 화면이 아니라 "데이터"를 먼저 설계합니다
    // ===========================================================

    // 할 일 하나 = 객체 하나
    //   { id: 1, text: "설거지", done: false }
    // 그런 객체들을 배열에 담습니다.

    let todos = [];          // 내용이 계속 바뀌므로 let
    let currentFilter = "all";

    // ⭐ 핵심 원칙
    //   데이터(todos)를 바꾼다  →  화면을 통째로 다시 그린다(render)
    //   화면을 직접 조금씩 고치려 들면 금방 꼬입니다.


    // ===========================================================
    // 2. 요소 선택 - 한곳에 모아둡니다
    // ===========================================================

    const todoInput = document.querySelector("#todoInput");
    const addBtn = document.querySelector("#addBtn");
    const todoList = document.querySelector("#todoList");
    const status = document.querySelector("#status");
    const filterBtns = document.querySelectorAll(".filters button");


    // ===========================================================
    // 3. 저장 / 불러오기 (localStorage)
    // ===========================================================

    // localStorage 는 브라우저가 제공하는 작은 저장소입니다.
    // 문자열만 저장할 수 있어서 JSON 으로 바꿔서 넣습니다.
    // (5일차에 파일로 저장했던 것과 같은 개념입니다)

    // try/catch 로 감싼 이유: 브라우저 설정이나 파일을 연 방식에 따라
    // localStorage 가 막혀 있으면 에러가 나면서 앱 전체가 멈춥니다.
    // "저장은 실패해도 앱은 돌아가게" 만드는 것이 방어적 프로그래밍입니다.
    // (파이썬에서 배운 try / except 와 같습니다)

    const save = () => {
      try {
        localStorage.setItem("todos", JSON.stringify(todos));
      } catch (e) {
        console.warn("저장에 실패했습니다:", e.message);
      }
    };

    const load = () => {
      try {
        const saved = localStorage.getItem("todos");
        todos = saved ? JSON.parse(saved) : [];
      } catch (e) {
        console.warn("불러오기에 실패했습니다:", e.message);
        todos = [];
      }
    };


    // ===========================================================
    // 4. 화면 그리기 - 이 함수가 이 프로그램의 심장입니다
    // ===========================================================

    function render() {
      // (1) 필터에 맞는 것만 골라냅니다
      const visible = todos.filter((todo) => {
        if (currentFilter === "active") return !todo.done;
        if (currentFilter === "done") return todo.done;
        return true;   // all
      });

      // (2) 목록을 비우고 다시 그립니다
      todoList.innerHTML = "";

      if (visible.length === 0) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "할 일이 없습니다.";
        todoList.appendChild(p);
      }

      visible.forEach((todo) => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        // 체크박스
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => toggleTodo(todo.id));

        // 글자
        const span = document.createElement("span");
        span.textContent = todo.text;

        // 삭제 버튼
        const delBtn = document.createElement("button");
        delBtn.textContent = "삭제";
        delBtn.addEventListener("click", () => removeTodo(todo.id));

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        todoList.appendChild(li);
      });

      // (3) 상태 표시
      const doneCount = todos.filter((t) => t.done).length;
      status.textContent = `전체 ${todos.length}개 · 완료 ${doneCount}개 · 남음 ${todos.length - doneCount}개`;
    }


    // ===========================================================
    // 5. 기능 함수들 - 데이터만 바꾸고 render() 를 부릅니다
    // ===========================================================

    function addTodo(text) {
      // 빈 값 방어
      if (text.trim() === "") {
        alert("할 일을 입력해 주세요.");
        return;
      }

      todos.push({
        id: Date.now(),        // 지금 시각(밀리초)을 고유 번호로 씀 - 간단한 방법
        text: text.trim(),
        done: false,
      });

      save();
      render();
    }

    function toggleTodo(id) {
      // find 로 해당 객체를 찾아 done 을 뒤집습니다
      const todo = todos.find((t) => t.id === id);
      if (todo) todo.done = !todo.done;
      save();
      render();
    }

    function removeTodo(id) {
      // filter 로 그 id 만 빼고 새 배열을 만듭니다
      todos = todos.filter((t) => t.id !== id);
      save();
      render();
    }


    // ===========================================================
    // 6. 이벤트 연결
    // ===========================================================

    addBtn.addEventListener("click", () => {
      addTodo(todoInput.value);
      todoInput.value = "";
      todoInput.focus();
    });

    todoInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") addBtn.click();
    });

    filterBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        // data-filter 속성값을 읽습니다 (HTML의 data-filter="all")
        currentFilter = btn.dataset.filter;

        // 버튼 활성 표시 갱신
        filterBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");

        render();
      });
    });


    // ===========================================================
    // 7. 시작
    // ===========================================================

    load();
    render();


    // ===========================================================
    // 도전 과제
    // ===========================================================
    //
    // 1. "완료된 항목 모두 삭제" 버튼을 추가하세요.
    //    (힌트: todos = todos.filter(t => !t.done))
    //
    // 2. 할 일 글자를 더블클릭하면 수정할 수 있게 만드세요.
    //    (힌트: dblclick 이벤트 + prompt())
    //
    // 3. 추가한 시각을 함께 저장하고 화면에 작게 표시하세요.
    //    (힌트: new Date().toLocaleString())
    //
    // 4. 우선순위(높음/보통/낮음)를 추가하고, 높은 것이 위로 오도록 정렬하세요.
    //
    // 5. 완성한 뒤 GitHub에 올리고 GitHub Pages 로 배포해 보세요.
    //    저장소 → Settings → Pages → Source 를 main 브랜치로 지정하면
    //    https://내아이디.github.io/저장소이름/ 주소로 실제 웹사이트가 됩니다.
    //    ★ 이력서에 넣을 수 있는 "돌아가는 결과물"이 됩니다.
  </script>

</body>
</html>
